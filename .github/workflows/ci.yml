# Default gate for V2 (two services). No secrets are configured: suites that
# need live providers or REAL_PDFS_DIR report SKIPPED, never fake a pass.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Private data and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Private-data guard (no real PDFs or real-document data)
        run: bash scripts/check-private-data.sh
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  engine:
    name: Engine (lint, types, tests, licenses, contract)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: bash scripts/check_licenses.sh
      - name: contracts/openapi.json is current
        run: uv run python scripts/export_openapi.py --check

  engine-image:
    name: Engine image builds and answers /health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t is-engine:ci engine
      - run: |
          docker run -d --name engine -p 127.0.0.1:8000:8000 is-engine:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 1; done
          docker logs engine; exit 1

  web:
    name: Web (tests, types, build, contract types, licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20 # matches the web Dockerfile base image
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated engine types match contracts/openapi.json
        run: npm run contract:types && git diff --exit-code -- app/lib/engine/contract.gen.ts
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: bash scripts/check-licenses.sh

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # Local Supabase stack (Docker on the runner) so durable uploads work;
      # never a hosted project. Exports SUPABASE_URL / SUPABASE_SECRET_KEY /
      # SUPABASE_STORAGE_BUCKET (masked) for the Playwright run.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Start local Supabase, apply db/migrations, create bucket
        run: bash scripts/e2e-local-supabase.sh
      # DB-backed suites that skip in the web job (no database there):
      # FILT-1 (M5) and the pgvector round-trip against the local stack.
      - name: Database integration tests (FILT-1, pgvector)
        run: npx vitest run tests/integration/m5-filt1.test.ts tests/integration/postgres-vector.test.ts
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7
