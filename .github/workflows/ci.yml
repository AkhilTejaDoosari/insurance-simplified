# Default gate (AGENTS.md "Checks"). No secrets are configured: suites that
# need live providers or REAL_PDFS_DIR report SKIPPED, never fake a pass.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Private-data guard (no real PDFs or real-document data)
        run: bash scripts/check-private-data.sh
      - name: Cloud-only inference guard (no local model runtime in app paths)
        run: bash scripts/check-no-local-inference.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 20 # matches the Dockerfile base image
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Local Supabase stack (Docker on the runner) so durable uploads work;
      # never a hosted project. Exports SUPABASE_URL / SUPABASE_SECRET_KEY /
      # SUPABASE_STORAGE_BUCKET (masked) for the Playwright run.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Start local Supabase, apply db/migrations, create bucket
        run: bash scripts/e2e-local-supabase.sh
      # DB-backed suites that skip in the check job (no database there):
      # FILT-1 (M5) and the pgvector round-trip against the local stack.
      - name: Database integration tests (FILT-1, pgvector)
        run: npx vitest run tests/integration/m5-filt1.test.ts tests/integration/postgres-vector.test.ts
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
